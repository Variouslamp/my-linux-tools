[window]
# Valor entre 0.0 (totalmente invisible) y 1.0 (totalmente opaco)
opacity = 0.85

[window.padding]
x = 12  # Margen izquierdo y derecho en píxeles
y = 12  # Margen superior e inferior en píxeles

[font]
size = 7.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
